<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deltatale</title>
  <meta name="description" content="A fan-made Undertale / Deltarune boss rush.">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="screen">
      <canvas id="game" width="720" height="405" tabindex="0" aria-label="Deltatale - game screen"></canvas>
    </div>

    <!-- Touch controls: only shown on touch screens (see style.css) -->
    <div class="touch-controls" aria-label="Touch controls">
      <div class="dpad">
        <button type="button" tabindex="-1" data-key="arrowup" class="dpad-up" aria-label="Up">▲</button>
        <button type="button" tabindex="-1" data-key="arrowleft" class="dpad-left" aria-label="Left">◀</button>
        <button type="button" tabindex="-1" data-key="p" class="dpad-center" aria-label="Pause">II</button>
        <button type="button" tabindex="-1" data-key="arrowright" class="dpad-right" aria-label="Right">▶</button>
        <button type="button" tabindex="-1" data-key="arrowdown" class="dpad-down" aria-label="Down">▼</button>
      </div>
      <div class="touch-actions">
        <button type="button" tabindex="-1" data-key="x" class="touch-action" aria-label="Back">X</button>
        <button type="button" tabindex="-1" data-key="z" class="touch-action touch-confirm" aria-label="Confirm">Z</button>
      </div>
    </div>
    <noscript><p class="noscript">Deltatale needs JavaScript to run.</p></noscript>
  </main>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/input.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/music.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/textbox.js"></script>
  <script src="js/bosses.js"></script>
  <script src="assets/bosses/manifest.js"></script>
  <script src="js/bossart.js"></script>
  <script src="js/attack_art.js"></script>
  <script src="js/attackart.js"></script>
  <script src="js/presence.js"></script>
  <script src="js/roster.js"></script>
  <script src="js/items.js"></script>
  <script src="js/state.js"></script>
  <script src="js/soul.js"></script>
  <script src="js/bullets.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/render.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/battle.js"></script>
  <script src="bosses/dummy.js"></script>
  <script src="bosses/napstablook.js"></script>
  <script src="bosses/toriel.js"></script>
  <script src="bosses/snowdin_dogs.js"></script>
  <script src="bosses/papyrus.js"></script>
  <script src="bosses/mad_dummy.js"></script>
  <script src="bosses/undyne.js"></script>
  <script src="bosses/muffet.js"></script>
  <script src="bosses/mettaton_ex.js"></script>
  <script src="bosses/asgore.js"></script>
  <script src="bosses/omega_flowey.js"></script>
  <script src="bosses/asriel.js"></script>
  <script src="bosses/undyne_undying.js"></script>
  <script src="bosses/sans.js"></script>

</body>
